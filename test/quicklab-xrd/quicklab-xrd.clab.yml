name: dorsi-quicklab-xrd
# The prefix is prepended to container node names. We override the default
# "clab-<lab-name>-" prefix here by using the "__lab-name" magic value.
# Containerlab replaces it with the lab name defined above. This ensures we're
# creating unique containers for each instance of the lab based on the same
# topology (=testenv).
prefix: __lab-name

mgmt:
  network: dorsi-quicklab-xrd
  ipv4-subnet: auto
  ipv6-subnet: auto

topology:
  kinds:
    xrd:
      image: ${IMAGE_PATH}ios-xr/xrd-control-plane:25.3.1
      startup-config: xrd-startup.conf
  nodes:
    ams-core-1:
      kind: xrd
    fra-core-1:
      kind: xrd
    sto-core-1:
      kind: xrd
    lju-core-1:
      kind: xrd
    sweave:
      kind: linux
      image: dorsi-sweave-base
      image-pull-policy: if-not-present
      ports:
        # The dorsi binary serves the APIs and the embedded Web UI on :80.
        - "${WEBUI_PUBLISH}:80/tcp"
        - "830/tcp"

  links:
    - endpoints: ["ams-core-1:Gi0-0-0-0", "fra-core-1:Gi0-0-0-0"]
    - endpoints: ["ams-core-1:Gi0-0-0-1", "sto-core-1:Gi0-0-0-0"]
    - endpoints: ["fra-core-1:Gi0-0-0-1", "sto-core-1:Gi0-0-0-1"]
    - endpoints: ["fra-core-1:Gi0-0-0-2", "lju-core-1:Gi0-0-0-0"]
    - endpoints: ["sto-core-1:Gi0-0-0-2", "lju-core-1:Gi0-0-0-1"]
