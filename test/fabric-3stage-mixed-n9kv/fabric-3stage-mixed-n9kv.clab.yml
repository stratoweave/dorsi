name: dorsi-fabric-3stage-mixed-n9kv
prefix: __lab-name

mgmt:
  network: dorsi-fabric-3stage-mixed-n9kv
  ipv4-subnet: 172.31.42.0/24
  ipv6-subnet: auto

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.3.2
      image-pull-policy: if-not-present
      startup-config: srl-startup.conf
    # Nexus 9300v is a VM (x86_64 with KVM): build the image with vrnetlab
    # from the qcow2 (see README.md).
    cisco_n9kv:
      image: vrnetlab/cisco_n9kv:9300-10.6.4.M
      image-pull-policy: never
      startup-config: n9kv-startup.cfg
      # mgmt0 takes the container's management address and gateway instead
      # of 10.0.0.15 behind NAT, so dorsi reaches the switch at the address
      # it renders on mgmt0 (management-address), as with Arista EOS
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
  nodes:
    leaf1:
      mgmt-ipv4: 172.31.42.11
      kind: nokia_srlinux
    leaf2:
      mgmt-ipv4: 172.31.42.12
      kind: cisco_n9kv
    leaf3:
      mgmt-ipv4: 172.31.42.13
      kind: cisco_n9kv
    spine1:
      mgmt-ipv4: 172.31.42.21
      kind: cisco_n9kv
    spine2:
      mgmt-ipv4: 172.31.42.22
      kind: nokia_srlinux
    server1:
      mgmt-ipv4: 172.31.42.31
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      image-pull-policy: if-not-present
      # The overlay test setup of ip-fabric-overlay.xml (tenant t1)
      exec:
        - ip link add link eth1 name eth1.30 type vlan id 30
        - ip link set eth1.30 up
        - ip address add 10.10.10.11/24 dev eth1.30
    server2:
      mgmt-ipv4: 172.31.42.32
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      image-pull-policy: if-not-present
      # The overlay test setup of ip-fabric-overlay.xml (tenant t1)
      exec:
        - ip link add link eth1 name eth1.30 type vlan id 30
        - ip link set eth1.30 up
        - ip address add 10.10.10.12/24 dev eth1.30
        - ip address add 10.20.20.12/24 dev eth1
    server3:
      mgmt-ipv4: 172.31.42.33
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      image-pull-policy: if-not-present
      # The overlay test setup of ip-fabric-overlay.xml (tenant t1)
      exec:
        - ip link add link eth1 name eth1.30 type vlan id 30
        - ip link set eth1.30 up
        - ip address add 10.10.10.13/24 dev eth1.30
        - ip address add 10.20.20.13/24 dev eth1
    sweave:
      mgmt-ipv4: 172.31.42.10
      kind: linux
      image: dorsi-sweave-base
      image-pull-policy: if-not-present
      ports:
        # The dorsi binary serves the APIs and the embedded Web UI on :80.
        - "${WEBUI_PUBLISH}:80/tcp"
        - "830/tcp"

  # Nexus 9300v maps the container interface ethN to Ethernet1/N.
  links:
    - endpoints: ["leaf1:e1-49", "spine1:eth1"]
    - endpoints: ["leaf1:e1-50", "spine2:e1-1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:e1-2"]
    - endpoints: ["leaf3:eth1", "spine1:eth3"]
    - endpoints: ["leaf3:eth2", "spine2:e1-3"]
    - endpoints: ["server1:eth1", "leaf1:e1-1"]
    - endpoints: ["server2:eth1", "leaf2:eth3"]
    - endpoints: ["server3:eth1", "leaf3:eth3"]
