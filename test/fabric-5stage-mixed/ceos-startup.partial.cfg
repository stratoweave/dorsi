username clab privilege 15 role network-admin secret clab@123
!
! EOS takes passwords only through keyboard-interactive by default; the
! NETCONF client of dorsi uses the password method.
management ssh
   authentication protocol keyboard-interactive password public-key
!
! Management0 and the NETCONF server in a VRF of their own, so that the
! management network never carries fabric traffic.
vrf instance MGMT
!
interface Management0
   vrf MGMT
!
management api netconf
   transport ssh default
      vrf MGMT
!
