name: dorsi-fabric-3stage-mixed
prefix: __lab-name

# Fixed management addresses: ip-fabric.xml gives the cEOS switches theirs as
# management-address, which dorsi keeps on Management0 and connects to.
mgmt:
  network: dorsi-fabric-3stage-mixed
  ipv4-subnet: 172.31.36.0/24
  ipv6-subnet: auto

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.3.2
      image-pull-policy: if-not-present
      startup-config: srl-startup.conf
    # cEOS-lab is not in a public registry: download it from arista.com and
    # `docker import` it under this name (see README.md).
    arista_ceos:
      image: ceos:4.36.3.2M
      image-pull-policy: never
      startup-config: ceos-startup.partial.cfg
  nodes:
    leaf1:
      mgmt-ipv4: 172.31.36.11
      kind: nokia_srlinux
    leaf2:
      mgmt-ipv4: 172.31.36.12
      kind: nokia_srlinux
    leaf3:
      mgmt-ipv4: 172.31.36.13
      kind: arista_ceos
    spine1:
      mgmt-ipv4: 172.31.36.21
      kind: nokia_srlinux
    spine2:
      mgmt-ipv4: 172.31.36.22
      kind: arista_ceos
    server1:
      mgmt-ipv4: 172.31.36.31
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      image-pull-policy: if-not-present
      # The overlay test setup of ip-fabric-overlay.xml (tenant t1)
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast xmit_hash_policy layer3+4
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip link add link bond0 name bond0.10 type vlan id 10
        - ip link set bond0.10 up
        - ip address add 10.10.10.11/24 dev bond0.10
    server2:
      mgmt-ipv4: 172.31.36.32
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      image-pull-policy: if-not-present
      # The overlay test setup of ip-fabric-overlay.xml (tenant t1)
      exec:
        - ip address add 10.10.10.12/24 dev eth2
    server3:
      mgmt-ipv4: 172.31.36.33
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      image-pull-policy: if-not-present
      # The overlay test setup of ip-fabric-overlay.xml (tenant t1)
      exec:
        - ip link add link eth1 name eth1.30 type vlan id 30
        - ip link set eth1.30 up
        - ip address add 10.10.10.13/24 dev eth1.30
    sweave:
      mgmt-ipv4: 172.31.36.10
      kind: linux
      image: dorsi-sweave-base
      image-pull-policy: if-not-present
      ports:
        # The dorsi binary serves the APIs and the embedded Web UI on :80.
        - "${WEBUI_PUBLISH}:80/tcp"
        - "830/tcp"

  # cEOS maps the container interface ethN to EthernetN.
  links:
    - endpoints: ["leaf1:e1-49", "spine1:e1-1"]
    - endpoints: ["leaf1:e1-50", "spine2:eth1"]
    - endpoints: ["leaf2:e1-49", "spine1:e1-2"]
    - endpoints: ["leaf2:e1-50", "spine2:eth2"]
    - endpoints: ["leaf3:eth49", "spine1:e1-3"]
    - endpoints: ["leaf3:eth50", "spine2:eth3"]
    - endpoints: ["server1:eth1", "leaf1:e1-1"]
    - endpoints: ["server1:eth2", "leaf2:e1-1"]
    - endpoints: ["server2:eth1", "leaf2:e1-2"]
    - endpoints: ["server2:eth2", "leaf3:eth1"]
    - endpoints: ["server3:eth1", "leaf3:eth2"]
