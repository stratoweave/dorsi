name: dorsi-quicklab-srl
# The prefix is prepended to container node names. We override the default
# "clab-<lab-name>-" prefix here by using the "__lab-name" magic value.
# Containerlab replaces it with the lab name defined above. This ensures we're
# creating unique containers for each instance of the lab based on the same
# topology (=testenv).
prefix: __lab-name

mgmt:
  network: dorsi-quicklab-srl
  ipv4-subnet: auto
  ipv6-subnet: auto

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.3.2
      image-pull-policy: if-not-present
      startup-config: srl-startup.conf
  nodes:
    ams-core-1:
      kind: nokia_srlinux
    fra-core-1:
      kind: nokia_srlinux
    sto-core-1:
      kind: nokia_srlinux
    lju-core-1:
      kind: nokia_srlinux
    sweave:
      kind: linux
      image: dorsi-sweave-base
      image-pull-policy: if-not-present
      ports:
        # The dorsi binary serves the APIs and the embedded Web UI on :80.
        - "${WEBUI_PUBLISH}:80/tcp"
        - "830/tcp"

  links:
    - endpoints: ["ams-core-1:e1-1", "fra-core-1:e1-1"]
    - endpoints: ["ams-core-1:e1-2", "sto-core-1:e1-1"]
    - endpoints: ["fra-core-1:e1-2", "sto-core-1:e1-2"]
    - endpoints: ["fra-core-1:e1-3", "lju-core-1:e1-1"]
    - endpoints: ["sto-core-1:e1-3", "lju-core-1:e1-2"]
